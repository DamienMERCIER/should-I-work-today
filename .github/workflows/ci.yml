name: CI

on:
  push:
    branches: [main]
  pull_request:

# Deployment is not done here: the worker goes out from a clean worktree with `wrangler deploy --config
# wrangler.local.toml`, which holds the namespace id. A deploy job would need account secrets this repository
# does not carry.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run check:spots
      - run: npm test
