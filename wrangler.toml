name = "should-i-work"
main = "src/index.ts"
compatibility_date = "2026-09-01"
workers_dev = true

[observability]
enabled = true

[triggers]
crons = ["0 17 * * *", "0 4 * * *", "5 17 * * SUN", "0 10 * * *"]

# Your own namespace: `npx wrangler kv namespace create KV`, then copy this file to wrangler.local.toml
# (git-ignored), put the id there, and deploy with `npx wrangler deploy --config wrangler.local.toml`.
[[kv_namespaces]]
binding = "KV"
id = "<your kv namespace id>"
